<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" role="img" aria-labelledby="title desc">
  <title id="title">아기돼지</title>
  <desc id="desc">분홍빛 볼과 큰 귀, 작은 발굽을 가진 귀여운 아기돼지가 앉아 웃고 있습니다.</desc>
  <defs>
    <radialGradient id="skin" cx="42%" cy="32%" r="78%"><stop stop-color="#FFF3E9"/><stop offset=".52" stop-color="#F7C9B7"/><stop offset="1" stop-color="#E9A58F"/></radialGradient>
    <linearGradient id="ear" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#F8CDB8"/><stop offset="1" stop-color="#E89E91"/></linearGradient>
    <radialGradient id="snout" cx="40%" cy="28%" r="80%"><stop stop-color="#FFC9BE"/><stop offset="1" stop-color="#E98F8B"/></radialGradient>
    <linearGradient id="bib" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#F3F6D8"/><stop offset="1" stop-color="#B8D5A8"/></linearGradient>
    <filter id="soft-shadow" x="-.25" y="-.25" width="1.5" height="1.7"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>
  <ellipse cx="264" cy="411" rx="164" ry="20" fill="#072D28" opacity=".2" filter="url(#soft-shadow)"/>
  <!-- curled tail -->
  <path d="M399 291c45-25 73-4 58 18-9 13-31 7-28-5 2-8 13-8 16-2" fill="none" stroke="#F2B7A5" stroke-width="15" stroke-linecap="round"/>
  <path d="M399 291c45-25 73-4 58 18-9 13-31 7-28-5 2-8 13-8 16-2" fill="none" stroke="#A75F58" stroke-opacity=".42" stroke-width="2.8" stroke-linecap="round"/>
  <!-- little seated body and legs -->
  <ellipse cx="263" cy="323" rx="135" ry="105" fill="url(#skin)" stroke="#713F3B" stroke-width="7"/>
  <ellipse cx="186" cy="366" rx="48" ry="33" fill="#F3B8A5" stroke="#713F3B" stroke-width="6"/>
  <ellipse cx="338" cy="366" rx="48" ry="33" fill="#F3B8A5" stroke="#713F3B" stroke-width="6"/>
  <path d="M150 377c15 4 28 4 43 0m125 0c15 4 28 4 43 0" stroke="#704540" stroke-width="5" stroke-linecap="round"/>
  <path d="M199 290c12 47 32 68 64 69 34 1 55-21 65-69" fill="url(#bib)" stroke="#527254" stroke-width="6" stroke-linejoin="round"/>
  <path d="m244 315 20 21 20-21" fill="none" stroke="#8DAF80" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="264" cy="351" r="6" fill="#DF9F79"/>
  <!-- ears -->
  <path d="M157 174c-35-28-58-64-57-111 44 5 86 31 105 76l-4 45-44-10Z" fill="url(#ear)" stroke="#713F3B" stroke-width="7" stroke-linejoin="round"/>
  <path d="M145 151c-18-20-29-42-30-63 23 8 43 23 56 45l-2 27-24-9Z" fill="#C97475" opacity=".62"/>
  <path d="M355 174c35-28 58-64 57-111-44 5-86 31-105 76l4 45 44-10Z" fill="url(#ear)" stroke="#713F3B" stroke-width="7" stroke-linejoin="round"/>
  <path d="M367 151c18-20 29-42 30-63-23 8-43 23-56 45l2 27 24-9Z" fill="#C97475" opacity=".62"/>
  <!-- big baby head -->
  <ellipse cx="256" cy="208" rx="163" ry="145" fill="url(#skin)" stroke="#713F3B" stroke-width="8"/>
  <path d="M132 142c23-42 68-67 123-68" fill="none" stroke="#FFF8F0" stroke-width="11" stroke-linecap="round" opacity=".7"/>
  <!-- cheeks -->
  <ellipse cx="145" cy="240" rx="31" ry="17" fill="#E98B91" opacity=".36"/>
  <ellipse cx="367" cy="240" rx="31" ry="17" fill="#E98B91" opacity=".36"/>
  <!-- soft brows and sparkling eyes -->
  <path d="M171 184c12-10 27-10 39-1m94 0c12-9 27-9 39 1" fill="none" stroke="#9B5D58" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="190" cy="205" rx="11" ry="15" fill="#4C3734"/>
  <ellipse cx="322" cy="205" rx="11" ry="15" fill="#4C3734"/>
  <circle cx="194" cy="200" r="4" fill="#FFFDF6"/>
  <circle cx="326" cy="200" r="4" fill="#FFFDF6"/>
  <!-- muzzle -->
  <ellipse cx="256" cy="260" rx="76" ry="53" fill="url(#snout)" stroke="#713F3B" stroke-width="7"/>
  <path d="M226 252c0-9 8-16 17-16s17 7 17 16v12c0 9-8 16-17 16s-17-7-17-16v-12Zm47 0c0-9 8-16 17-16s17 7 17 16v12c0 9-8 16-17 16s-17-7-17-16v-12Z" fill="#9F5E60" opacity=".8"/>
  <path d="M249 301c5 6 11 9 18 9s13-3 18-9" fill="none" stroke="#A65E5B" stroke-width="5" stroke-linecap="round"/>
  <!-- tiny forehead curl -->
  <path d="M249 89c-15-21-3-35 12-33 14 2 17 17 8 25-6 5-15 2-15-5" fill="none" stroke="#D98979" stroke-width="7" stroke-linecap="round"/>
  <path d="M235 119c11 8 24 12 39 11" fill="none" stroke="#FFF5EE" stroke-width="5" stroke-linecap="round" opacity=".6"/>
</svg>
