name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 10:47, 16:47 and 19:47 Korea Standard Time.
    - cron: '47 1,7,10 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static files
        run: |
          mkdir dist
          cp index.html styles.css app.js pig-3d.js growth-simulator.js course.html course.css course-data.js course.js farm-layout.png favicon.svg .nojekyll dist/
          cp -R assets dist/
      - name: Refresh Dabom pig carcass quote
        run: node scripts/update-pig-price.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
